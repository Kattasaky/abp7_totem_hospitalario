{% extends 'base.html' %}

{% block content %}

<div class="text-center">
    <h2 class="mb-4">Ingreso de Paciente</h2>

    <form method="POST" class="col-md-6 mx-auto">
        {% csrf_token %}
        
        <input class="form-control mb-3 text-center" type="text" name="rut" placeholder="Ingrese su RUT">

        <button class="btn btn-primary w-100">Confirmar llegada</button>
    </form>

    {% if error %}
    <div class="alert alert-danger mt-3">
        {{ error }}
    </div>
    {% endif %}
</div>

{% endblock %}
