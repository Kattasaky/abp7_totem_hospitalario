{% extends 'base.html' %}

{% block content %}

<h2>Pacientes</h2>

<a href="/checkin/crear/" class="btn btn-primary mb-3">Nuevo Paciente</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>RUT</th>
            <th>Acción</th>
        </tr>
    </thead>

    <tbody>
    {% for p in pacientes %}
        <tr>
            <td>{{ p.nombre }}</td>
            <td>{{ p.rut }}</td>
            <td>
                <a href="/checkin/pacientes/eliminar/{{p.id}}/" class="btn btn-danger btn-sm">
                    Eliminar
                </a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
